[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet-to-allegro"
version = "0.5.53rc1"
description = "Evidence-first Datasheet to Allegro closed-loop footprint engineering"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11", "pydantic>=2.7", "pypdf>=5", "shapely>=2.1", "rapidocr-onnxruntime==1.4.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ds2allegro = "datasheet_to_allegro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
